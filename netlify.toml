[build]
  command = "npm run build"
  publish = "dist/nunegal-frontend-dev-test/browser"

[build.environment]
  NODE_VERSION = "22"


[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build output (outputHashing: all) can be cached indefinitely.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must always be revalidated so new deployments are picked up.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

<fieldset class="option-selector">
  <legend class="option-selector__legend">{{ legend() }}</legend>
  <div class="option-selector__options">
    @for (option of options(); track option.code) {
      <label class="option-selector__option">
        <input
          type="radio"
          class="option-selector__input"
          [name]="name()"
          [id]="optionId(option.code)"
          [checked]="option.code === selected()"
          (change)="selected.set(option.code)"
        />
        <span class="option-selector__chip">{{ option.name }}</span>
      </label>
    }
  </div>
</fieldset>

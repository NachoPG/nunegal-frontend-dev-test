<div class="search-bar">
  <label class="visually-hidden" for="search-bar-input">Buscar por marca o modelo</label>
  <div class="search-bar__field">
    <svg class="search-bar__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path
        fill="currentColor"
        d="M10 2a8 8 0 1 0 4.9 14.32l5.39 5.39 1.42-1.42-5.39-5.39A8 8 0 0 0 10 2Zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12Z"
      />
    </svg>
    <input
      id="search-bar-input"
      class="search-bar__input"
      type="search"
      autocomplete="off"
      placeholder="Buscar por marca o modelo…"
      [value]="term()"
      (input)="onInput($event)"
    />
    @if (term().length > 0) {
      <button
        type="button"
        class="search-bar__clear"
        aria-label="Borrar búsqueda"
        (click)="term.set('')"
      >
        ×
      </button>
    }
  </div>

  <p class="visually-hidden" aria-live="polite">
    {{ resultCount() }} {{ resultCount() === 1 ? 'resultado' : 'resultados' }}
  </p>
</div>
